name: ci

# Runs platform's .NET checks and builds the Docker image.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: kubernetes-learning-platform/platform/.github/workflows/dotnet-ci.yml@main

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag api:ci .
